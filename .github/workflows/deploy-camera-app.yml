name: Deploy camera-app to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/build-app-no-loans-0nRKq
    paths:
      - "camera-app/**"
      - ".github/workflows/deploy-camera-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: camera-app

      - id: deployment
        uses: actions/deploy-pages@v4
