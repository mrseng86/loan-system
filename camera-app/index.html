<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>网美拍照辅助</title>
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <main id="app">
    <section id="home" class="screen">
      <h1>📸 网美拍照辅助</h1>
      <p class="subtitle">叠加构图线和姿势引导，再也不会被嫌弃不会拍</p>
      <div class="reference-picker">
        <button id="reference-btn" class="secondary" type="button">选择参考图拍同款</button>
        <div id="reference-preview" class="reference-preview" hidden>
          <img id="reference-thumb" alt="参考图预览" />
          <div class="reference-meta">
            <strong id="reference-name">已选择参考图</strong>
            <span id="reference-pose-status" class="reference-pose-status">姿势尚未读取</span>
            <button id="clear-reference-btn" class="link" type="button">移除</button>
          </div>
        </div>
      </div>
      <button id="start-btn" class="primary big">开启相机</button>
      <p id="error" class="error" hidden></p>
      <p class="hint">实时预览失败？<button type="button" id="fallback-btn" class="link">用系统相机拍</button></p>
      <input id="reference-input" type="file" accept="image/*" hidden />
      <input id="capture-input" type="file" accept="image/*" capture="environment" hidden />
    </section>

    <section id="camera" class="screen camera-screen" hidden>
      <video id="video" autoplay playsinline webkit-playsinline muted></video>
      <img id="reference-overlay" class="reference-overlay" alt="半透明参考图" hidden />
      <svg id="overlay" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      <canvas id="canvas" hidden></canvas>

      <div class="top-bar">
        <button id="close-btn" class="icon-btn" aria-label="关闭">✕</button>
        <div class="tip" id="tip"></div>
        <button id="native-btn" class="icon-btn native-btn" aria-label="跳到原相机">📷</button>
      </div>

      <div class="poses-bar">
        <div class="poses-scroll" id="poses-scroll"></div>
      </div>

      <div id="reference-panel" class="reference-panel" hidden>
        <button id="reference-toggle-btn" class="mini-btn" type="button">隐藏同款图</button>
        <button id="reference-change-btn" class="mini-btn" type="button">换图</button>
        <label class="opacity-control">
          <span>透明度</span>
          <input id="reference-opacity" type="range" min="15" max="80" value="38" />
        </label>
      </div>

      <div id="live-pose-match" class="live-pose-match" hidden>
        <strong id="live-pose-score">--</strong>
        <span id="live-pose-tip">读取姿势中...</span>
      </div>

      <div class="controls">
        <button id="switch-btn" class="icon-btn" aria-label="切换摄像头">⟳</button>
        <button id="shutter-btn" class="shutter" aria-label="拍照"></button>
        <button id="grid-btn" class="icon-btn" aria-label="切换网格">⊞</button>
      </div>
    </section>

    <section id="preview" class="screen preview-screen" hidden>
      <img id="preview-img" alt="预览" />
      <div id="score-panel" class="score-panel" hidden>
        <div class="score-head">
          <div>
            <p class="score-label">AI 拍照评分</p>
            <p id="score-summary" class="score-summary">正在分析这张照片...</p>
          </div>
          <strong id="score-value" class="score-value">--</strong>
        </div>
        <div id="score-metrics" class="score-metrics"></div>
        <div id="pose-score-panel" class="pose-score-panel" hidden>
          <div>
            <span class="pose-score-label">同款姿势匹配</span>
            <strong id="pose-score-value">--</strong>
          </div>
          <p id="pose-score-tip">先选择参考图，再拍照匹配姿势。</p>
        </div>
        <ul id="score-tips" class="score-tips"></ul>
      </div>
      <div class="preview-controls">
        <button id="retake-btn">重拍</button>
        <a id="save-btn" class="primary" download="photo.jpg">保存</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
