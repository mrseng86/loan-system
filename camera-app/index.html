<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>拍照 App</title>
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <main id="app">
    <section id="home" class="screen">
      <h1>拍照 App</h1>
      <p>点下面按钮调用相机拍照</p>

      <label class="primary big">
        📷 拍照
        <input id="capture-input" type="file" accept="image/*" capture="environment" hidden />
      </label>

      <label class="secondary">
        🖼 从相册选
        <input id="gallery-input" type="file" accept="image/*" hidden />
      </label>
    </section>

    <section id="preview" class="screen" hidden>
      <img id="preview-img" alt="预览" />
      <div class="preview-controls">
        <button id="retake-btn">重拍</button>
        <a id="save-btn" class="primary" download="photo.jpg">保存到相册</a>
      </div>
    </section>
  </main>

  <script src="app.js?v=5"></script>
</body>
</html>
